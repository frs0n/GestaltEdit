name: Release unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -sdk iphoneos \
            -archivePath build/GestaltEdit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/GestaltEdit.xcarchive/Products/Applications/*.app Payload/
          zip -r GestaltEdit.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-IPA
          path: GestaltEdit.ipa
